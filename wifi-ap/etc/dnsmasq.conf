# Dnsmasq configuration for midirouter Access Point
# Provides DHCP and DNS services to connected clients

interface=wlan0
dhcp-range=10.0.0.2,10.0.0.50,255.255.255.0,24h
dhcp-authoritative          # enforce our DNS answers — required for the captive portal
dhcp-option=3,10.0.0.1    # Default gateway (the Pi)
dhcp-option=6,10.0.0.1     # DNS server (the Pi)

# Static DNS entry for captive portal:
# Clients can access the web interface via http://midirouter
address=/midirouter/10.0.0.1

# Captive portal: resolve EVERY hostname to the gateway so that all
# client traffic (including the OS connectivity probes like
# captive.apple.com / connectivitycheck.gstatic.com) hits the Pi;
# iptables then redirects TCP/80 to the web UI on port 3000.
address=/#/10.0.0.1

# Cache size (entries)
cache-size=1000

# Log queries for debugging
log-queries
