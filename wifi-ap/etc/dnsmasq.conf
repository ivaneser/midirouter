# Dnsmasq configuration for midirouter Access Point
# Provides DHCP and DNS services to connected clients

interface=wlan0
dhcp-range=10.0.0.2,10.0.0.50,255.255.255.0,24h
dhcp-option=3,10.0.0.1    # Default gateway (the Pi)
dhcp-option=6,10.0.0.1     # DNS server (the Pi)

# Cache size (entries)
cache-size=1000

# Log queries for debugging
log-queries
