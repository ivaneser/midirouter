# Hostapd configuration for midirouter WiFi Access Point
# SSID: midirouter
# Password: midirouter

interface=wlan0
driver=nl80211
ssid=midirouter
hw_mode=g
channel=6
macaddr_acl=0
auth_algs=1
wpa=2
wpa_passphrase=midirouter
wpa_key_mgmt=WPA-PSK
wpa_pairwise=TKIP
rsn_pairwise=CCMP

# Logging
logger_syslog=1
logger_syslog_level=2
logger_stdout=1
logger_stdout_level=2

# Beacon interval and DTIM parameters
beacon_int=100
dtim_period=2

# RADIUS server settings (not used, but required by hostapd)
radius_server_type=0
radius_server_addr=127.0.0.1
radius_server_port=1812
radius_server_secret=secret
