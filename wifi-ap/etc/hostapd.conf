# Hostapd configuration for midirouter WiFi Access Point
# SSID: midirouter
# Password: midirouter

interface=wlan0
driver=nl80211
ssid=midirouter
hw_mode=g
channel=6

# 802.11n (HT) with WMM: far more throughput than legacy 11g, and latency-sensitive traffic goes ahead of bulk data.
ieee80211n=1
wmm_enabled=1
macaddr_acl=0
auth_algs=1
wpa=2
wpa_passphrase=midirouter
wpa_key_mgmt=WPA-PSK
wpa_pairwise=TKIP
rsn_pairwise=CCMP

# Logging
logger_syslog=1
logger_syslog_level=2
logger_stdout=1
logger_stdout_level=2

# Beacon interval and DTIM parameters
beacon_int=100
# DTIM 1: sleeping clients wake on every beacon, so notes and audio reach them without the extra wait.
dtim_period=1

# RADIUS server settings (not used, but required by hostapd)
