<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIDI Router</title>
    <link rel="stylesheet" href="/css/style.css?v=8">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="header">
            <h1>🎹 MIDI Router</h1>
            <div class="status-bar">
                <span id="connection-status" class="status-indicator disconnected">● Disconnected</span>
                <button id="btn-connect" class="btn btn-primary">Connect</button>
            </div>
        </header>

        <!-- Configuration Panel -->
        <section class="config-panel">
            <h2>⚙️ Configuration</h2>
            
            <!-- Save/Load buttons -->
            <div class="config-actions" style="margin-bottom: 16px;">
                <button class="btn btn-primary" id="btn-save-config">💾 Save</button>
                <button class="btn" id="btn-load-config">📂 Load</button>
            </div>
            
            <!-- Routes -->
            <div class="config-section">
                <h3>🔌 Routes</h3>
                <p class="tab-hint">A route sends MIDI from one input device to one output device.</p>
                <div class="mapping-list" id="mapping-list"></div>
                <button class="btn btn-primary" id="btn-add-mapping">+ Add Route</button>
            </div>
            

        </section>

        <!-- DAW / Clip controls -->
        <section class="daw-panel">
            <h2>🎵 DAW — Clips & Record</h2>
            <div class="daw-controls">
                <label>Mode:
                    <select id="record-mode">
                        <option value="none">Play</option>
                        <option value="replace">Replace</option>
                        <option value="overdub">Overdub</option>
                    </select>
                </label>
                <label>BPM:
                    <input type="number" id="tempo" min="20" max="300" step="1" value="120">
                </label>
                <button id="tap-tempo" class="btn">Tap Tempo</button>
                <div class="metronome-controls">
                    <button id="metronome-toggle" class="btn" title="Toggle metronome">♪ Metro</button>
                    <label class="metro-beats">
                        Beats:
                        <select id="metro-beats">
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4" selected>4</option>
                            <option value="5">5</option>
                            <option value="6">6</option>
                            <option value="7">7</option>
                            <option value="8">8</option>
                        </select>
                    </label>
                </div>
                <label>Slots/track:
                    <select id="slots">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="4">4</option>
                        <option value="8">8</option>
                    </select>
                </label>
                <label class="chk"><input type="checkbox" id="auto-assign" checked> auto-assign pads</label>
                <label>Preset:
                    <input type="text" id="preset-name" placeholder="name">
                </label>
                <button id="preset-save" class="btn">Save</button>
                <select id="preset-load">
                    <option value="">-- load --</option>
                </select>
            </div>

            <div class="session-controls">
                <label class="chk"><input type="checkbox" id="auto-assign" checked> auto-assign pads</label>
                <span class="session-mode-label">Session Mode:</span>
                <select id="session-record-mode">
                    <option value="none">Play</option>
                    <option value="replace">Replace</option>
                    <option value="overdub">Overdub</option>
                </select>
            </div>
            <div id="session-grid" class="session-grid"></div>
            <p class="daw-hint">Press pads on your LaunchKey: note-on = arm/trigger, note-off = finish + play. Notes you play get recorded into the active clip.</p>
        </section>

        <!-- Logs -->
        <details class="debug-panel">
            <summary>Logs</summary>
            <div id="logs"></div>
        </details>
    </div>

    <script type="module" src="/js/app.js?v=8"></script>
</body>
</html>
